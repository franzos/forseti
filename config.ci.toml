# Forseti — CI / playground configuration.
#
# Committed (unlike config.toml, which is gitignored) so CI can boot Forseti
# against the infra/ docker-compose playground deterministically. Point at it
# with FORSETI_CONFIG_PATH=config.ci.toml. NOT production values.

[kratos]
public_url = "http://localhost:4433"
admin_url  = "http://localhost:4434"

[hydra]
public_url = "http://localhost:4444"
admin_url  = "http://localhost:4445"
# Forseti fronts Hydra's issuer origin (infra/hydra/hydra.yml sets the issuer
# to http://host.containers.internal:3000/hydra).
front_proxy = true
issuer = "http://host.containers.internal:3000/hydra"

[self]
url = "http://localhost:3000"

[brand]
name          = "Forseti CI"
support_email = "support@example.com"

# Playground / integration-test overrides (NOT production values).
[oauth]
# Resource the RFC 8707 bridge test binds into the access-token audience.
allowed_resource_audiences = ["https://mcp.test"]

# Integration fixtures serve CIMD documents from loopback http, so the SSRF
# guard stands down in CI. Never enable in production. Rate buckets relaxed
# for the suite's burst traffic.
[oauth.cimd]
allow_private_targets = true
ip_rate_per_minute = 1000
ip_rate_per_hour   = 10000
global_rate_per_minute = 1000
global_rate_per_hour   = 10000

# The integration suite inits 140+ registration flows from one loopback IP in
# a few seconds, so the production per-IP 300/hour default would 429 mid-run.
# Relaxed here the same way claim_email is.
[auth]
registration_ip_rate_per_minute     = 1000
registration_ip_rate_per_hour        = 10000
registration_global_rate_per_minute  = 1000
registration_global_rate_per_hour    = 10000

# `make seed-admin` plants this identity (password + TOTP) so admin-gated
# integration + Playwright tests run unattended. Keep this list in sync with
# SEED_ADMIN_EMAIL in infra/seed-admin.sh.
[admin]
allowed_emails = ["admin@example.com"]

# Kratos runs in the compose network and reaches the audit webhook receiver
# via host.docker.internal:8081 (compose maps that to the host gateway), so
# the internal listener must bind on all interfaces — loopback-only would
# stall flow responses by ~90s on the webhook retry timeout.
[internal]
bind = "0.0.0.0:8081"

[email]
enabled = true
from_address = "no-reply@forseti.test"
provider = "smtp"
host = "127.0.0.1"
port = 1025
tls = "none"

# Shared bearer with infra/kratos/kratos.yml (`auth.config.value`). Required —
# Forseti refuses to boot with it empty.
[audit]
webhook_token = "dev-playground-token-change-me"
ip_salt = ""
audit_retention_days = 90

# Relaxed so the suite's repeat /claim-email hits don't 429 on the shared
# loopback bucket.
[claim_email]
rate_limit_per_minute = 100
rate_limit_per_hour = 1000

# Public /users/{id} view + members-roster links. The profile-visibility e2e
# specs (same-group directory, profile teams/hosts) drive this surface.
[profiles]
enabled = true

# Mounts /sso/{slug} + /sso/callback so the SAML integration tests run.
# Jackson itself is NOT in the playground; the suite only exercises the
# Forseti-side paths (neutral pages, state validation).
[saml]
jackson_url = "http://127.0.0.1:5225"
jackson_api_key = "dev-jackson-api-key"
client_secret_verifier = "dev-client-secret-verifier"

# POSIX/Linux-auth device grant. The device-auth integration tests need the
# forseti-linux-pam client provisioned in Hydra (`make seed-posix-client` runs
# `forseti posix-init-client`, wired into CI). Fixed secret so the seed + tests
# are deterministic; without a provisioned client those tests skip cleanly.
[posix]
pam_client_id = "forseti-linux-pam"
pam_client_secret = "dev-posix-pam-secret-change-me"
# Hydra stamps id_tokens with iss=http://host.containers.internal:3000/hydra (see
# infra/hydra/hydra.yml). The device-auth binding validates that iss, so it must
# match here; without it we fall back to [hydra].public_url (localhost:4444) and
# every device approval is denied as token_invalid. Also feeds the CSP
# form-action allowlist with the issuer's browser-facing origin.
hydra_issuer = "http://host.containers.internal:3000/hydra"

# cargo-deny config. CI runs `cargo deny check advisories` (RustSec advisory DB)
# as a blocking job against Cargo.lock and forseti-unix/Cargo.lock (which uses
# forseti-unix/deny.toml), see .github/workflows/ci.yml.
# Add advisory IDs to `ignore` with a one-line rationale to silence a known,
# accepted finding.
[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
  # basic-toml is unmaintained with no successor. It reaches the tree only
  # through askama_derive, which reads askama.toml at compile time, so it is
  # not in the shipped binary and parses no untrusted input. Drops when
  # askama releases a version that moves off it.
  "RUSTSEC-2026-0374",
]

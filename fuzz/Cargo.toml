edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
axum = { version = "0.8", default-features = false }
url = "2"
forseti = { path = ".." }

[[bin]]
name = "return_to"

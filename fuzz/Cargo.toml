test = false
doc = false
bench = false

[[bin]]
name = "csrf"
path = "fuzz_targets/csrf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "locale"
path = "fuzz_targets/locale.rs"
test = false
doc = false
bench = false

[[bin]]
name = "yaml"
path = "fuzz_targets/yaml.rs"
test = false
